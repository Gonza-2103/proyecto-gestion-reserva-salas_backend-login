#Identificación y puerto del backend (necesario para no chocar con el puerto 8080 de los otros backends)
spring.application.name=login
server.port=${SERVER_PORT:8081}

#Conexión a PostgreSQL (Supabase)
spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Propiedades opcionales (comentadas porque no son obligatorias según el documento)
# spring.datasource.hikari.maximum-pool-size=5
# spring.datasource.hikari.minimum-idle=2
# spring.jpa.open-in-view=false

#Configuración JWT (clave de al menos 32 caracteres para HS256)
jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaLoginDuocUC2026!}
jwt.expiration=${JWT_EXPIRATION:86400000}